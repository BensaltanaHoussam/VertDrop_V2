# ===============================
# PROPRIÉTÉS POUR LES TESTS D'INTÉGRATION
# ===============================

# --- Base de données H2 en mémoire ---
# URL de connexion pour une base de données privée en mémoire nommée 'testdb'
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# Create tables automatically for tests (since we don't have the real DB)
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Liquibase for tests (unless you specifically need to test migrations)
spring.liquibase.enabled=false

# Disable strict OAuth2 checks for context loading
spring.security.oauth2.client.registration.google.client-id=test-id
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.facebook.client-id=test-id
spring.security.oauth2.client.registration.facebook.client-secret=test-secret
spring.security.oauth2.client.registration.okta.client-id=test-id
spring.security.oauth2.client.registration.okta.client-secret=test-secret
spring.security.oauth2.client.provider.okta.issuer-uri=https://test.okta.com