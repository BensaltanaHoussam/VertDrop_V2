# --- DATABASE CONFIG (H2) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

# --- SECURITY CONFIG (DUMMY VALUES) ---
# These prevent "Could not resolve placeholder" errors
spring.security.oauth2.client.registration.google.client-id=fake-google-id
spring.security.oauth2.client.registration.google.client-secret=fake-google-secret

spring.security.oauth2.client.registration.facebook.client-id=fake-facebook-id
spring.security.oauth2.client.registration.facebook.client-secret=fake-facebook-secret

spring.security.oauth2.client.registration.okta.client-id=fake-okta-id
spring.security.oauth2.client.registration.okta.client-secret=fake-okta-secret

# Provider settings are required for context load
spring.security.oauth2.client.provider.okta.issuer-uri=https://dev-fake.okta.com

