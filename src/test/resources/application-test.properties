# ===============================
# PROPRIÉTÉS POUR LES TESTS D'INTÉGRATION
# ===============================

# --- Base de données H2 en mémoire ---
# URL de connexion pour une base de données privée en mémoire nommée 'testdb'
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Configuration de JPA/Hibernate pour les tests ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# LA PROPRIÉTÉ LA PLUS IMPORTANTE :
# 'create-drop' va créer le schéma de la base de données au début des tests
# et le détruire complètement à la fin. Cela garantit que chaque test
# s'exécute sur une base de données propre.
spring.jpa.hibernate.ddl-auto=create-drop

# (Optionnel) Affiche les requêtes SQL exécutées par Hibernate dans la console.
# Très utile pour le débogage.
spring.jpa.show-sql=true

# (Optionnel) Formate joliment les requêtes SQL affichées.
spring.jpa.properties.hibernate.format_sql=true

# --- Console H2 (Optionnel mais très utile) ---
# Permet d'accéder à une interface web pour voir l'état de la base de données
# pendant qu'un test est en pause (avec un point d'arrêt du débogueur).
spring.h2.console.enabled=true
# L'URL pour accéder à la console sera http://localhost:8080/h2-console
spring.h2.console.path=/h2-console