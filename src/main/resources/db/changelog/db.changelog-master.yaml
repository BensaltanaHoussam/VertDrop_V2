databaseChangeLog:
  - changeSet:
      id: 1
      author: houssam
      changes:
        - createTable:
            tableName: client_expediteur
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: telephone
                  type: VARCHAR(20)
              - column:
                  name: adresse
                  type: VARCHAR(255)

  - changeSet:
      id: 2
      author: houssam
      changes:
        - createTable:
            tableName: destinataire
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: telephone
                  type: VARCHAR(20)
              - column:
                  name: adresse
                  type: VARCHAR(255)

  - changeSet:
      id: 3
      author: houssam
      changes:
        - createTable:
            tableName: zone
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code_postal
                  type: VARCHAR(20)

  - changeSet:
      id: 4
      author: houssam
      changes:
        - createTable:
            tableName: livreur
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: telephone
                  type: VARCHAR(20)
              - column:
                  name: vehicule
                  type: VARCHAR(50)
              - column:
                  name: zone_assignee
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: livreur
            baseColumnNames: zone_assignee
            referencedTableName: zone
            referencedColumnNames: id
            constraintName: fk_livreur_zone

  - changeSet:
      id: 5
      author: houssam
      changes:
        - createTable:
            tableName: colis
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: poids
                  type: DECIMAL(10,2)
              - column:
                  name: statut
                  type: VARCHAR(50)
              - column:
                  name: priorite
                  type: INT
              - column:
                  name: id_livreur
                  type: BIGINT
              - column:
                  name: id_client
                  type: BIGINT
              - column:
                  name: id_destinataire
                  type: BIGINT
              - column:
                  name: id_zone
                  type: BIGINT
              - column:
                  name: ville_destination
                  type: VARCHAR(100)
        - addForeignKeyConstraint:
            baseTableName: colis
            baseColumnNames: id_livreur
            referencedTableName: livreur
            referencedColumnNames: id
            constraintName: fk_colis_livreur
        - addForeignKeyConstraint:
            baseTableName: colis
            baseColumnNames: id_client
            referencedTableName: client_expediteur
            referencedColumnNames: id
            constraintName: fk_colis_client
        - addForeignKeyConstraint:
            baseTableName: colis
            baseColumnNames: id_destinataire
            referencedTableName: destinataire
            referencedColumnNames: id
            constraintName: fk_colis_destinataire
        - addForeignKeyConstraint:
            baseTableName: colis
            baseColumnNames: id_zone
            referencedTableName: zone
            referencedColumnNames: id
            constraintName: fk_colis_zone

  - changeSet:
      id: 6
      author: houssam
      changes:
        - createTable:
            tableName: historique_livraison
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: id_colis
                  type: BIGINT
              - column:
                  name: statut
                  type: VARCHAR(50)
              - column:
                  name: date_changement
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: commentaire
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: historique_livraison
            baseColumnNames: id_colis
            referencedTableName: colis
            referencedColumnNames: id
            constraintName: fk_historique_colis

  - changeSet:
      id: 7
      author: houssam
      changes:
        - createTable:
            tableName: produit
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: categorie
                  type: VARCHAR(255)
              - column:
                  name: poids
                  type: DECIMAL(10,2)
              - column:
                  name: prix
                  type: DECIMAL(10,2)

  - changeSet:
      id: 8
      author: houssam
      changes:
        - createTable:
            tableName: colis_produit
            columns:
              - column:
                  name: id_colis
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: id_produit
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: quantite
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: prix
                  type: DECIMAL(10,2)
              - column:
                  name: date_ajout
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: colis_produit
            baseColumnNames: id_colis
            referencedTableName: colis
            referencedColumnNames: id
            constraintName: fk_colisproduit_colis
        - addForeignKeyConstraint:
            baseTableName: colis_produit
            baseColumnNames: id_produit
            referencedTableName: produit
            referencedColumnNames: id
            constraintName: fk_colisproduit_produit

  - changeSet:
      id: 9
      author: houssam
      changes:
        # 1. Création de la table pour les rôles (ex: ROLE_MANAGER)
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

        # 2. Création de la table pour les utilisateurs avec un ID de type UUID
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        # 3. Création de la table de jointure pour la relation Many-to-Many
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        # 4. Ajout de la clé primaire sur la table de jointure
        - addPrimaryKey:
            tableName: users_roles
            columnNames: user_id, role_id
            constraintName: pk_users_roles

        # 5. Ajout des contraintes de clé étrangère
        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users_roles_user
        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_roles_role

  - changeSet:
      id: 10
      author: houssam
      changes:
        # Add user_id column to client_expediteur table
        - addColumn:
            tableName: client_expediteur
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: true  # nullable for existing records

        # Add user_id column to livreur table
        - addColumn:
            tableName: livreur
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: true  # nullable for existing records

        # Add foreign key constraint for client_expediteur
        - addForeignKeyConstraint:
            baseTableName: client_expediteur
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_client_expediteur_user
            onDelete: SET NULL  # If user is deleted, don't delete the client record

        # Add foreign key constraint for livreur
        - addForeignKeyConstraint:
            baseTableName: livreur
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_livreur_user
            onDelete: SET NULL

        # Add unique constraint (one user can only be linked to one client)
        - addUniqueConstraint:
            tableName: client_expediteur
            columnNames: user_id
            constraintName: uk_client_expediteur_user

        # Add unique constraint (one user can only be linked to one livreur)
        - addUniqueConstraint:
            tableName: livreur
            columnNames: user_id
            constraintName: uk_livreur_user

  - changeSet:
      id: 12
      author: houssam
      changes:
        # Create permissions table
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)

        # Create roles_permissions join table
        - createTable:
            tableName: roles_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false

        # Add primary key constraint
        - addPrimaryKey:
            tableName: roles_permissions
            columnNames: role_id, permission_id
            constraintName: pk_roles_permissions

        # Add foreign key constraints
        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_roles_permissions_role
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_roles_permissions_permission
            onDelete: CASCADE